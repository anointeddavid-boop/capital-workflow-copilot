name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install what the tests need
        run: pip install anthropic psycopg2-binary python-dotenv pytest ruff
      - name: Check for code errors
        run: ruff check --select E9,F63,F7,F82 backend tests
      - name: Run tests
        run: python -m pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build -t capital-workflow-copilot-api .
