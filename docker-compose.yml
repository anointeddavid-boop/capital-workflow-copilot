services:
  db:
    image: pgvector/pgvector:pg16
    container_name: copilot-db
    env_file: .env
    ports:
      - "5433:5432"
    volumes:
      - copilot_pgdata:/var/lib/postgresql/data

  api:
    build: .
    container_name: copilot-api
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  copilot_pgdata:
